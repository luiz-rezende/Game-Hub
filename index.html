<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | GAMEHUB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-login">

  <header>
    <a href="index.html" aria-label="Página de login"><h1 class="logo"><span>G</span>AME<span>HUB</span></h1></a>
  </header>

  <main class="login-main">
    <div class="skyline" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <section class="login-card">
      <h1>Bem-vindo <span>de volta</span></h1>
      <p class="login-subtitulo">Entre na sua conta para acessar jogos, rankings e notícias da nossa comunidade.</p>

      <div class="login-alerta" id="formAlert" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="campo" id="fieldEmail">
          <label for="email">E-mail</label>
          <div class="campo-input">
            <input type="email" id="email" placeholder="seuemail@exemplo.com" autocomplete="email">
          </div>
          <div class="msg-erro">Digite um e-mail válido.</div>
        </div>

        <div class="campo" id="fieldPass">
          <label for="senha">Senha</label>
          <div class="campo-input">
            <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password">
            <button type="button" class="btn-mostrar-senha" id="togglePass">MOSTRAR</button>
          </div>
          <div class="msg-erro">A senha deve ter pelo menos 6 caracteres.</div>
        </div>

        <div class="login-opcoes">
          <label class="lembrar"><input type="checkbox" id="lembrar"> Lembrar de mim</label>
          <a href="#" id="esqueci">Esqueci a senha</a>
        </div>

        <button type="submit" class="btn-entrar" id="btnLogin">Entrar</button>
      </form>

      <p class="login-cadastro">Ainda não tem conta? <a href="#" id="criarConta">Cadastre-se</a></p>
    </section>
  </main>

  <footer class="footer-login">© 2026 GameHub. Todos os direitos reservados.</footer>

  <script src="script.js"></script>
</body>
</html>
